server:
  port: ${PORT}
  servlet:
    session:
      cookie:
        name: AUTHSERVERSESSION
spring:
  profiles:
    default: ${SPRING_PROFILE}
  application:
    name: auth-service
    port: ${PORT}
  security:
    oauth2:
      authorizationserver:
        issuer-url: ${ISSUER}
        delete-code-ttl: 5
        access-token-ttl-minutes: 15
        refresh-token-ttl-hours: 2
        refresh-code-length: 92
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:5432/auth_service
    username: admin
    password: admin
  liquibase:
    enabled: true
    drop-first: false
    change-log: classpath:db/changelog-master.yaml
    default-schema: public
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show-sql: true

swagger-server: http://localhost:8082/