server:
  port: 80
  servlet:
    session:
      cookie:
        name: AUTHSERVERSESSION
spring:
  application:
    name: auth-service
    port: 80
  security:
    oauth2:
      authorizationserver:
        issuer-url: http://auth-service
        delete-code-ttl: 5
        access-token-ttl-minutes: 15
        refresh-token-ttl-hours: 2
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://postgres:5432/auth_service
    username: admin
    password: admin
  liquibase:
    enabled: true
    drop-first: false
    change-log: classpath:db/changelog-master.yaml
    default-schema: public
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show-sql: true

swagger-server: http://localhost:8082/

otel:
  traces:
    sampler: always_on
  exporter:
    otlp:
      traces:
        endpoint: http://otel-collector.monitoring.svc.cluster.local:4317
        protocol: grpc
      metrics:
        endpoint: http://otel-collector.monitoring.svc.cluster.local:4317
        protocol: grpc
      logs:
        endpoint: http://otel-collector.monitoring.svc.cluster.local:4317
        protocol: grpc